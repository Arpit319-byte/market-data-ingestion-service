spring.application.name=StockAnalyzerMarketData

# MySQL (set SPRING_DATASOURCE_URL to jdbc:mysql://localhost:3306/stockanalyzer)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Kite credentials are read from the environment. Leave the data_sources secret columns empty.
kite.api.key=${KITE_API_KEY:}
kite.api.secret=${KITE_API_SECRET:}
kite.instruments.max=1300
kite.backfill.delay-ms=350
kite.retention.one-minute-days=180
kite.scheduler.reconciliation-cron=0 0 16 * * MON-FRI
kite.scheduler.retention-cron=0 0 2 * * *

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# Optional: override token endpoint if Groww changes it
# groww.api.token-url=https://api.groww.in/v1/token/api/access

# Live candles arrive on the Kite WebSocket. These crons only connect and disconnect it.
kite.stream.enabled=true
kite.stream.start-cron=0 14 9 * * MON-FRI
kite.stream.stop-cron=0 31 15 * * MON-FRI
kite.stream.flush-cron=5 * 9-15 * * MON-FRI


# Logging - readable console output
logging.pattern.console=%d{HH:mm:ss.SSS} %clr(%-5level) %clr([%15.15t]) %clr(%-40.40logger{39}) %clr(:) %m%n

# Log levels
logging.level.root=INFO
logging.level.com.example.stockanalyzer=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

app.security.api-key=${APP_API_KEY:}
app.encryption.key=${APP_ENCRYPTION_KEY:}
app.cluster.heartbeat-enabled=true
app.cluster.heartbeat-ms=20000
app.cluster.leader-stale-seconds=60
app.websocket.allowed-origin-patterns=${APP_ALLOWED_ORIGINS:http://localhost:8080}

# Increasing the size so that CSV file can be downloaded
spring.codec.max-in-memory-size=100MB
